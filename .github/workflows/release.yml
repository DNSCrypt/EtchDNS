name: Release Binaries

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a test build, nothing gets published (e.g., 0.2.1)"
        required: true
        default: "dev"

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: ""
            suffix: ""
          - features: "hooks"
            suffix: "-hooks"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build optimized binary
        run: |
          if [ "${{ matrix.features }}" == "" ]; then
            cargo build --release --target x86_64-unknown-linux-gnu
          else
            cargo build --release --target x86_64-unknown-linux-gnu --features ${{ matrix.features }}
          fi

          # Strip the binary to reduce size
          strip target/x86_64-unknown-linux-gnu/release/etchdns

      - name: Package binary
        run: |
          PACKAGE_NAME="etchdns-${VERSION}-linux-x86_64${{ matrix.suffix }}"
          mkdir -p "${PACKAGE_NAME}"
          cp target/x86_64-unknown-linux-gnu/release/etchdns "${PACKAGE_NAME}/"
          cp README.md "${PACKAGE_NAME}/"
          cp LICENSE "${PACKAGE_NAME}/" || echo "No LICENSE file found"
          cp etchdns.toml "${PACKAGE_NAME}/"
          cp allowed_zones.txt "${PACKAGE_NAME}/" || echo "No allowed_zones.txt file found"
          cp nx_zones.txt "${PACKAGE_NAME}/" || echo "No nx_zones.txt file found"

          # Create SHA256 checksum file
          cd "${PACKAGE_NAME}"
          sha256sum etchdns > SHA256SUMS.txt
          cd ..

          tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: etchdns-linux-x86_64${{ matrix.suffix }}
          path: etchdns-*-linux-x86_64${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
        features:
          - ""
          - "hooks"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build optimized binary
        run: |
          if [ "${{ matrix.features }}" == "" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          fi

          # Strip the binary to reduce size
          strip target/${{ matrix.target }}/release/etchdns

      - name: Package binary
        run: |
          SUFFIX=""
          if [ "${{ matrix.features }}" != "" ]; then
            SUFFIX="-${{ matrix.features }}"
          fi
          PACKAGE_NAME="etchdns-${VERSION}-macos-${{ matrix.arch }}${SUFFIX}"
          mkdir -p "${PACKAGE_NAME}"
          cp target/${{ matrix.target }}/release/etchdns "${PACKAGE_NAME}/"
          cp README.md "${PACKAGE_NAME}/"
          cp LICENSE "${PACKAGE_NAME}/" || echo "No LICENSE file found"
          cp etchdns.toml "${PACKAGE_NAME}/"
          cp allowed_zones.txt "${PACKAGE_NAME}/" || echo "No allowed_zones.txt file found"
          cp nx_zones.txt "${PACKAGE_NAME}/" || echo "No nx_zones.txt file found"

          # Create SHA256 checksum file
          cd "${PACKAGE_NAME}"
          shasum -a 256 etchdns > SHA256SUMS.txt
          cd ..

          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: etchdns-macos-${{ matrix.arch }}${{ matrix.features != '' && format('-{0}', matrix.features) || '' }}
          path: etchdns-*-macos-${{ matrix.arch }}${{ matrix.features != '' && format('-{0}', matrix.features) || '' }}.zip
          if-no-files-found: error

  build-openbsd:
    name: Build OpenBSD (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start OpenBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          architecture: x86-64
          version: "8.0"
          cpu_count: 4

      - name: Build optimized binary
        shell: cpa.sh {0}
        run: |
          sudo pkg_add -I rust

          CARGO_TARGET_DIR="$HOME/target" cargo build --release

          cp "$HOME/target/release/etchdns" etchdns
          strip etchdns
          ./etchdns --version

      - name: Package binary
        run: |
          PACKAGE_NAME="etchdns-${VERSION}-openbsd-x86_64"
          mkdir -p "${PACKAGE_NAME}"
          cp etchdns "${PACKAGE_NAME}/"
          cp README.md "${PACKAGE_NAME}/"
          cp LICENSE "${PACKAGE_NAME}/" || echo "No LICENSE file found"
          cp etchdns.toml "${PACKAGE_NAME}/"
          cp allowed_zones.txt "${PACKAGE_NAME}/" || echo "No allowed_zones.txt file found"
          cp nx_zones.txt "${PACKAGE_NAME}/" || echo "No nx_zones.txt file found"

          cd "${PACKAGE_NAME}"
          sha256sum etchdns > SHA256SUMS.txt
          cd ..

          tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: etchdns-openbsd-x86_64
          path: etchdns-*-openbsd-x86_64.tar.gz
          if-no-files-found: error

  # Create a combined artifact with all binaries
  combine-artifacts:
    name: Combine Artifacts
    needs: [build-linux, build-macos, build-openbsd]
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: etchdns-*
          path: artifacts

      - name: Create combined archive
        run: |
          mkdir -p "etchdns-${VERSION}-all"
          cp -r artifacts/*/* "etchdns-${VERSION}-all/"

          # Create a combined SHA256SUMS file for all archives
          echo "# SHA256 checksums for EtchDNS ${VERSION} release packages" > "etchdns-${VERSION}-SHA256SUMS.txt"
          echo "# Generated on $(date -u)" >> "etchdns-${VERSION}-SHA256SUMS.txt"
          echo "" >> "etchdns-${VERSION}-SHA256SUMS.txt"

          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort | while IFS= read -r file; do
            sha256sum "$file" | sed 's|artifacts/[^/]*/||' >> "etchdns-${VERSION}-SHA256SUMS.txt"
          done

          tar -czf "etchdns-${VERSION}-all.tar.gz" "etchdns-${VERSION}-all"

      - name: Generate subjects for provenance
        id: hash
        run: |
          set -euo pipefail
          cd "etchdns-${VERSION}-all"
          subjects=$(sha256sum -- *.tar.gz *.zip)
          cd ..
          subjects+=$'\n'$(sha256sum -- "etchdns-${VERSION}-all.tar.gz" "etchdns-${VERSION}-SHA256SUMS.txt")
          echo "digests=$(printf '%s\n' "$subjects" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            etchdns-*-all.tar.gz
            etchdns-*-SHA256SUMS.txt
          if-no-files-found: error

      # Publishing from this single job avoids the build jobs racing to create the release.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/*/*
            etchdns-*-all.tar.gz
            etchdns-*-SHA256SUMS.txt

  provenance:
    needs: [combine-artifacts]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.combine-artifacts.outputs.digests }}
      upload-assets: ${{ github.event_name == 'push' }}
