[package]
name = "etchdns"
version = "0.9.1"
edition = "2024"
description = "Caching DNS proxy and forwarding server with load balancing, failover, domain filtering, and WebAssembly plugins"
authors = ["Frank Denis"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/dnscrypt/etchdns"
homepage = "https://github.com/dnscrypt/etchdns"
documentation = "https://github.com/dnscrypt/etchdns"
keywords = ["dns", "dns-proxy", "cache", "forwarder", "webassembly"]
categories = ["network-programming", "caching", "web-programming"]
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/etchdns.toml",
    "/allowed_zones.txt",
    "/nx_zones.txt",
]

[lib]
name = "etchdns"
path = "src/lib.rs"

[[bin]]
name = "etchdns"
path = "src/main.rs"

[features]
default = []
hooks = ["extism"]

[dependencies]
bpf = "0.1.5"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
slabigator = "0.9"
parking_lot = "0.12.5"
time-format = "1.2.4"
rand = "0.10"
byteorder = "1.5"
futures = "0.3.34"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
bytes = "1.12"
tower = "0.5"
tower-http = { version = "0.7", features = ["limit"] }
sieve-cache = "1.2.0"
base64 = "0.23"
form_urlencoded = "1.2"
extism = { version = "1.41.0", optional = true }
privdrop = "0.5.7"
httpdate = "1.0.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4.6"
